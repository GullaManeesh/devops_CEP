
name: Student Result Checker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test backend and frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and push Docker images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/result-checker-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/result-checker-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/result-checker-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/result-checker-frontend:${{ github.sha }}

  deploy-smoke-test:
    name: Deploy and smoke-test
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start application containers
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          sed "s|result-checker-backend:1.0|${DOCKERHUB_USERNAME}/result-checker-backend:latest|g; s|result-checker-frontend:1.0|${DOCKERHUB_USERNAME}/result-checker-frontend:latest|g" docker-compose.yml > docker-compose.ci.yml
          docker compose -f docker-compose.ci.yml up -d

      - name: Wait for application startup
        run: sleep 10

      - name: Smoke-test API through frontend
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8081/api/health
          curl --fail http://localhost:8081/api/results/101

      - name: Show logs if deployment fails
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Stop containers
        if: always()
        run: |
          if [ -f docker-compose.ci.yml ]; then
            docker compose -f docker-compose.ci.yml down -v
          fi
